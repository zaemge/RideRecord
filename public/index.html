<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#eef8ff"
  >

  <title>RideRecord</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>


<body>

  <div class="app">


    <!-- =========================
         ส่วนหัว
    ========================== -->

    <header class="topbar">

      <div>

        <p class="eyebrow">
          RIDERECORD
        </p>

        <h1>
          ภาพรวมการเดินทาง
        </h1>

      </div>


      <button
        class="profile-button"
        type="button"
      >
        RR
      </button>

    </header>



    <main>


      <!-- =========================
           รถที่กำลังใช้งาน
      ========================== -->

      <section
        class="glass vehicle-card"
      >

        <div>

          <span class="label">
            รถที่เลือก
          </span>

          <h2 id="currentVehicle">
            Honda Civic
          </h2>

        </div>


        <div class="vehicle-controls">

          <select id="vehicleSelect">
          </select>


          <button
            id="addVehicleButton"
            type="button"
          >
            + เพิ่มรถ
          </button>

        </div>

      </section>



      <!-- =========================
           สรุปรายเดือน
      ========================== -->

      <section class="summary-grid">


        <div
          class="glass summary-card"
        >

          <span>
            ค่าใช้จ่ายเดือนนี้
          </span>

          <strong id="monthlyCost">
            ฿0
          </strong>

        </div>



        <div
          class="glass summary-card"
        >

          <span>
            น้ำมันเดือนนี้
          </span>

          <strong id="monthlyLiters">
            0 L
          </strong>

        </div>



        <div
          class="glass summary-card"
        >

          <span>
            ระยะทางเดือนนี้
          </span>

          <strong id="monthlyDistance">
            0 km
          </strong>

        </div>



        <div
          class="glass summary-card"
        >

          <span>
            อัตราสิ้นเปลือง
          </span>

          <strong id="fuelEfficiency">
            0 km/L
          </strong>

        </div>


      </section>



      <!-- =========================
           เมนูด่วน
      ========================== -->

      <section class="quick-actions">


        <button
          class="primary-action"
          id="openFuelModal"
          type="button"
        >

          <span class="action-icon">
            ＋
          </span>


          <span>

            <strong>
              บันทึกการเติมน้ำมัน
            </strong>

            <small>
              เพิ่มข้อมูลการเติมครั้งล่าสุด
            </small>

          </span>

        </button>



        <button
          class="secondary-action"
          id="openTripButton"
          type="button"
        >

          <span class="action-icon">
            ↗
          </span>


          <span>

            <strong>
              เพิ่มทริป
            </strong>

            <small>
              บันทึกการเดินทางใหม่
            </small>

          </span>

        </button>


      </section>



      <!-- =========================
           ประวัติล่าสุด
      ========================== -->

      <section class="section">


        <div class="section-title">

          <h2>
            รายการล่าสุด
          </h2>


          <button
            id="viewAllHistory"
            type="button"
          >
            ดูทั้งหมด
          </button>

        </div>


        <div
          id="fuelHistory"
          class="history-list"
        >

          <div
            class="glass empty-state"
          >
            ยังไม่มีข้อมูลการเติมน้ำมัน
          </div>

        </div>


      </section>


    </main>



    <!-- =========================
         เมนูด้านล่าง
    ========================== -->

    <nav class="bottom-nav">


      <button
        class="nav-item active"
        type="button"
      >

        <span>
          ⌂
        </span>

        <small>
          หน้าหลัก
        </small>

      </button>



      <button
        class="nav-item"
        type="button"
      >

        <span>
          ▤
        </span>

        <small>
          บันทึก
        </small>

      </button>



      <button
        class="nav-item"
        type="button"
      >

        <span>
          ⌁
        </span>

        <small>
          ทริป
        </small>

      </button>



      <button
        class="nav-item"
        type="button"
      >

        <span>
          ◉
        </span>

        <small>
          รถ
        </small>

      </button>


    </nav>


  </div>



  <!-- =========================
       หน้าต่างเติมน้ำมัน
  ========================== -->

  <div
    class="modal"
    id="fuelModal"
  >


    <div class="modal-backdrop">
    </div>


    <div class="modal-sheet glass">


      <div class="modal-header">


        <div>

          <span class="label">
            เพิ่มรายการ
          </span>

          <h2>
            เติมน้ำมัน
          </h2>

        </div>


        <button
          id="closeFuelModal"
          class="close-button"
          type="button"
        >
          ×
        </button>


      </div>



      <form id="fuelForm">


        <!-- รถ -->

        <label>

          รถ

          <select
            id="fuelVehicle"
            required
          >
          </select>

        </label>



        <!-- วันที่ -->

        <label>

          วันที่เติม

          <input
            id="fuelDate"
            type="date"
            required
          >

        </label>



        <!-- ราคาน้ำมัน -->

        <label>

          ราคาน้ำมัน / ลิตร

          <div class="input-unit">

            <input
              id="fuelPrice"
              type="number"
              step="0.01"
              min="0"
              inputmode="decimal"
              placeholder="เช่น 34.50"
              required
            >

            <span>
              บาท
            </span>

          </div>

        </label>



        <!-- จำนวนลิตร -->

        <label>

          ปริมาณน้ำมัน

          <div class="input-unit">

            <input
              id="fuelLiters"
              type="number"
              step="0.01"
              min="0"
              inputmode="decimal"
              placeholder="เช่น 35.20"
              required
            >

            <span>
              ลิตร
            </span>

          </div>

        </label>



        <!-- เลขไมล์ -->

        <label>

          เลขไมล์

          <div class="input-unit">

            <input
              id="odometer"
              type="number"
              step="1"
              min="0"
              inputmode="numeric"
              placeholder="เช่น 54210"
              required
            >

            <span>
              km
            </span>

          </div>

        </label>



        <!-- ยอดรวม -->

        <div class="cost-preview">

          <span>
            ยอดรวมโดยประมาณ
          </span>


          <strong id="costPreview">
            ฿0.00
          </strong>

        </div>



        <!-- ปุ่มบันทึก -->

        <button
          type="submit"
          class="save-button"
        >
          บันทึกข้อมูล
        </button>


      </form>


    </div>


  </div>



  <!-- =========================
       หน้าต่างจัดการรถ
  ========================== -->

  <div
    class="modal"
    id="vehicleModal"
  >


    <div
      class="modal-backdrop vehicle-backdrop"
    >
    </div>


    <div class="modal-sheet glass">


      <div class="modal-header">


        <div>

          <span class="label">
            จัดการรถ
          </span>

          <h2>
            รถของฉัน
          </h2>

        </div>


        <button
          id="closeVehicleModal"
          class="close-button"
          type="button"
        >
          ×
        </button>


      </div>



      <!-- เพิ่ม / แก้ไขรถ -->

      <div class="vehicle-form">


        <label>

          ชื่อรถ

          <input
            id="vehicleNameInput"
            type="text"
            placeholder="เช่น Honda Civic"
            autocomplete="off"
          >

        </label>



        <button
          id="saveVehicleButton"
          class="save-button"
          type="button"
        >
          เพิ่มรถ
        </button>


      </div>



      <!-- รายการรถ -->

      <div class="vehicle-list-title">

        รถที่บันทึกไว้

      </div>


      <div id="vehicleList">
      </div>


    </div>


  </div>



  <!-- =========================
       JavaScript
  ========================== -->

  <script src="/app.js"></script>


</body>
</html>
